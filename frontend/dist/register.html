<div class="form-container">

    <div class="form-card">

        <h1>Create Account</h1>

        <form id="registerForm">

            <label>Name</label>

            <input
                type="text"
                id="registerName"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p id="registerMessage"></p>


        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>
