    <a href="dashboard.html">
        Dashboard

<div class="container">

    <div class="upload-card">

        <h1>Upload Resume</h1>

        <p>
            Supported formats: PDF and DOCX
        </p>

        <div class="file-upload-group">
            <label for="resumeFile">Resume file</label>
            <input
                type="file"
                id="resumeFile"
                accept=".pdf,.docx"
            >
        </div>

        <div class="photo-upload-group">
            <label>Profile photo / document photo</label>
            <div class="photo-actions">
                <button type="button" id="cameraButton" class="secondary-btn">
                    Use Camera
                </button>
                <button type="button" id="uploadPhotoButton" class="secondary-btn">
                    Upload Photo
                </button>
            </div>

            <input
                type="file"
                id="photoUpload"
                accept="image/*"
                capture="environment"
                hidden
            >

            <video id="cameraPreview" autoplay playsinline muted hidden></video>
            <canvas id="photoCanvas" hidden></canvas>

            <div id="photoPreviewWrapper" class="photo-preview-wrapper" hidden>
                <img id="photoPreview" alt="Captured or uploaded photo preview">
            </div>

            <button type="button" id="capturePhotoButton" class="secondary-btn hidden">
                Capture Photo
            </button>
        </div>


        <label for="expectedJobRole">Expected Job Role</label>
        <select id="expectedJobRole">
            <option value="Python Developer" selected>Python Developer</option>
            <option value="AI/ML Engineer">AI/ML Engineer</option>
            <option value="Frontend Developer">Frontend Developer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Software Developer">Software Developer</option>
            <option value="Backend Developer">Backend Developer</option>
            <option value="Full Stack Developer">Full Stack Developer</option>
            <option value="Financial Analyst">Financial Analyst</option>
        </select>

        <label for="jobDescription">Sample Job Description (editable)</label>

        <textarea
            id="jobDescription"
            aria-describedby="jobDescriptionHelp"
        >Loading sample job description...</textarea>
        <p id="jobDescriptionHelp" class="form-help">
            Choose a role to load its sample description, then edit it to match the job you want.
        </p>


        <button id="analyzeResumeButton" type="button">
            Analyze Resume
        </button>


        <p id="uploadMessage"></p>
    </div>

</div>


</body>

</html>
